name: Deploy

on:
  push:
    branches: [ develop, main ]

jobs:
  # ──────────────────────────────────────────
  # 1. JAR 빌드 → Docker 이미지 → GHCR 푸시
  # ──────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "DOCKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew bootJar -x test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Discord 알림 (빌드 실패)
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"빌드 실패 ❌\",\"description\":\"**브랜치**: ${{ github.ref_name }}\\n**커밋**: ${{ github.sha }}\",\"color\":15158332}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

  # ──────────────────────────────────────────
  # 2. API 서버 Blue-Green 무중단 배포 (EC2 t3.small)
  #    nginx 컨테이너가 proxy 네트워크로 blue/green 컨테이너에 라우팅
  # ──────────────────────────────────────────
  deploy-api:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Blue-Green Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 스왑 설정 (최초 1회만 실행, 이후 멱등성 보장)
            if [ "$(sudo swapon --show | wc -l)" -eq 0 ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "✅ 스왑 2GB 설정 완료"
            else
              echo "스왑 이미 설정됨, 스킵"
            fi

            # 인증서 자동 갱신 크론 설정 (최초 1회만)
            # Let's Encrypt 인증서는 90일 유효, 만료 30일 전에만 실제 갱신됨
            # 월 1일·15일 03:00 실행 → 갱신 후 nginx 무중단 리로드
            if [ ! -f /etc/cron.d/certbot-renew ]; then
              echo "0 3 1,15 * * root certbot renew --webroot -w /var/www/certbot --quiet && docker exec nginx nginx -s reload" \
                | sudo tee /etc/cron.d/certbot-renew
              sudo chmod 644 /etc/cron.d/certbot-renew
              echo "✅ 인증서 자동 갱신 크론 설정 완료"
            else
              echo "인증서 자동 갱신 크론 이미 설정됨, 스킵"
            fi

            IMAGE=$(echo "ghcr.io/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')

            # proxy 네트워크 생성 (없으면)
            docker network create proxy 2>/dev/null || true

            # nginx 설정 파일 생성/업데이트
            # - 인증서 있으면: HTTPS conf (배포마다 갱신)
            # - 인증서 없고 conf 없으면: HTTP 임시 conf (certbot 실행 후 재배포 시 자동 HTTPS 전환)
            # - 인증서 없고 conf 있으면: 기존 conf 유지
            mkdir -p /home/ec2-user/nginx/conf.d /var/www/certbot
            CERT=/etc/letsencrypt/live/ggs-back.duckdns.org/fullchain.pem
            if [ -f "$CERT" ]; then
              {
                echo 'server {'
                echo '    listen 80;'
                echo '    server_name ggs-back.duckdns.org;'
                echo '    location /.well-known/acme-challenge/ { root /var/www/certbot; }'
                echo '    location / { return 301 https://$host$request_uri; }'
                echo '}'
                echo 'server {'
                echo '    listen 443 ssl;'
                echo '    server_name ggs-back.duckdns.org;'
                echo '    ssl_certificate     /etc/letsencrypt/live/ggs-back.duckdns.org/fullchain.pem;'
                echo '    ssl_certificate_key /etc/letsencrypt/live/ggs-back.duckdns.org/privkey.pem;'
                echo '    location / {'
                echo '        resolver           127.0.0.11 valid=10s;'
                echo '        set $upstream      "blue";'
                echo '        proxy_pass         http://$upstream:8080;'
                echo '        proxy_http_version 1.1;'
                echo '        proxy_set_header   Host              $host;'
                echo '        proxy_set_header   X-Real-IP         $remote_addr;'
                echo '        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;'
                echo '        proxy_set_header   X-Forwarded-Proto $scheme;'
                echo '        proxy_read_timeout 60s;'
                echo '    }'
                echo '}'
              } > /home/ec2-user/nginx/conf.d/app.conf
              echo "✅ HTTPS nginx 설정 적용"
            elif [ ! -f /home/ec2-user/nginx/conf.d/app.conf ]; then
              {
                echo 'server {'
                echo '    listen 80;'
                echo '    server_name ggs-back.duckdns.org;'
                echo '    location /.well-known/acme-challenge/ { root /var/www/certbot; }'
                echo '    location / {'
                echo '        resolver           127.0.0.11 valid=10s;'
                echo '        set $upstream      "blue";'
                echo '        proxy_pass         http://$upstream:8080;'
                echo '        proxy_http_version 1.1;'
                echo '        proxy_set_header   Host              $host;'
                echo '        proxy_set_header   X-Real-IP         $remote_addr;'
                echo '        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;'
                echo '        proxy_set_header   X-Forwarded-Proto $scheme;'
                echo '        proxy_read_timeout 60s;'
                echo '    }'
                echo '}'
              } > /home/ec2-user/nginx/conf.d/app.conf
              echo "⚠️ 인증서 없음 → HTTP 임시 설정 생성. certbot 실행 후 재배포하면 자동으로 HTTPS 전환"
            fi

            # nginx 컨테이너 실행 (없으면)
            if ! docker ps --format '{{.Names}}' | grep -q '^nginx$'; then
              docker run -d \
                --name nginx \
                --network proxy \
                -p 80:80 \
                -p 443:443 \
                -v /home/ec2-user/nginx/conf.d:/etc/nginx/conf.d:ro \
                -v /etc/letsencrypt:/etc/letsencrypt:ro \
                -v /var/www/certbot:/var/www/certbot:ro \
                --restart unless-stopped \
                nginx:stable-alpine
              echo "✅ nginx 컨테이너 시작"
            fi

            # GHCR 로그인 및 새 이미지 pull
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull $IMAGE

            # 현재 활성 슬롯 확인 (없으면 blue 기준)
            ACTIVE=$(grep -oP 'set \$upstream\s*"\K[^"]+' /home/ec2-user/nginx/conf.d/app.conf 2>/dev/null || echo "blue")

            if [ "$ACTIVE" = "blue" ]; then
              NEW_COLOR=green; OLD_COLOR=blue
            else
              NEW_COLOR=blue; OLD_COLOR=green
            fi

            echo "배포 방향: $OLD_COLOR → $NEW_COLOR"

            # 대기 슬롯에 남아있는 컨테이너 정리
            docker stop $NEW_COLOR 2>/dev/null || true
            docker rm  $NEW_COLOR 2>/dev/null || true

            # 새 컨테이너 실행 (proxy 네트워크, 호스트 포트 노출 없음)
            docker run -d \
              --name $NEW_COLOR \
              --network proxy \
              --restart no \
              -m 768m \
              -e SPRING_PROFILES_ACTIVE="prod,api" \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              -e IGDB_CLIENT_ID="${{ secrets.IGDB_CLIENT_ID }}" \
              -e IGDB_CLIENT_SECRET="${{ secrets.IGDB_CLIENT_SECRET }}" \
              -e STEAM_API_KEY="${{ secrets.STEAM_API_KEY }}" \
              -e DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}" \
              $IMAGE

            # 헬스체크 (10초 간격, 최대 120초 대기)
            # nginx가 proxy 네트워크로 새 컨테이너에 직접 접근
            echo "헬스체크 대기 중..."
            for i in $(seq 1 12); do
              STATUS=$(docker exec nginx wget -qO- http://$NEW_COLOR:8080/actuator/health 2>/dev/null | grep -o '"status":"UP"' || echo "")
              if [ -n "$STATUS" ]; then
                echo "✅ 헬스체크 통과 ($((i * 10))초)"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "❌ 헬스체크 실패 → 롤백"
                docker stop $NEW_COLOR && docker rm $NEW_COLOR
                exit 1
              fi
              echo "대기 중... ($i/12)"
              sleep 10
            done

            # Nginx 트래픽 전환 (다운타임 없음)
            sed -i 's/set \$upstream *"'"$OLD_COLOR"'";/set \$upstream "'"$NEW_COLOR"'";/' /home/ec2-user/nginx/conf.d/app.conf
            docker exec nginx nginx -s reload
            echo "✅ Nginx 전환 완료: $OLD_COLOR → $NEW_COLOR"

            # 구 컨테이너 종료
            docker stop $OLD_COLOR 2>/dev/null || true
            docker rm  $OLD_COLOR 2>/dev/null || true

            # 미사용 이미지 정리
            docker image prune -f

      - name: Discord 알림 (API 배포)
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993; STATUS="성공 ✅"
          else
            COLOR=15158332; STATUS="실패 ❌"
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"API 배포 ${STATUS}\",\"description\":\"**브랜치**: ${{ github.ref_name }}\\n**커밋**: ${{ github.sha }}\",\"color\":${COLOR}}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

  # ──────────────────────────────────────────
  # 3. Batch ECS Task Definition 업데이트
  #    새 SHA 이미지로 revision 등록
  #    EventBridge는 항상 최신 revision 사용 (Terraform 설정)
  # ──────────────────────────────────────────
  deploy-batch:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC 토큰 발급
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Update ECS Task Definition
        run: |
          NEW_IMAGE=$(echo "ghcr.io/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')

          # 현재 task definition 조회
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition nbe-team02-batch \
            --query 'taskDefinition' \
            --output json)

          # 새 이미지로 교체 후 불필요한 필드 제거
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$NEW_IMAGE" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions[0].image = $IMAGE')

          # 새 revision 등록 (EventBridge가 다음 실행 시 자동으로 사용)
          aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --region ap-northeast-2

          echo "✅ ECS Task Definition 업데이트 완료 → 다음 배치 실행 시 새 이미지 적용"

      - name: Discord 알림 (Batch 배포)
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993; STATUS="성공 ✅"
          else
            COLOR=15158332; STATUS="실패 ❌"
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Batch Task Definition 업데이트 ${STATUS}\",\"description\":\"**브랜치**: ${{ github.ref_name }}\\n**커밋**: ${{ github.sha }}\",\"color\":${COLOR}}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
