name: Code Quality Checks, Test Coverage Check

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop, 1-feat-code-qualityyml-추가 ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Kotlin 코드 스타일 체크 (ktlint) with ReviewDog
      - name: Run ktlint with ReviewDog
        uses: reviewdog/action-ktlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          fail_on_error: false
          ktlint_version: v1.0.1

      # Detekt with ReviewDog
      - name: detekt
        uses: reviewdog/action-detekt@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          detekt_config: config/detekt/detekt.yml

      # Coverage
      - name: Test
        run: ./gradlew test jacocoTestReport

      - name: Coverage Report
        uses: reviewdog/action-jacoco@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          jacoco_xml_path: build/reports/jacoco/test/jacocoTestReport.xml
          reporter: github-check
          min_coverage: 70