# HTTP: Certbot webroot 인증 경로 제공 + HTTPS 리다이렉트
server {
    listen 80;
    server_name ggs-back.duckdns.org;

    # certbot webroot 인증 (인증서 갱신 시 nginx 재시작 불필요)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 리버스 프록시 (Blue-Green)
server {
    listen 443 ssl;
    server_name ggs-back.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ggs-back.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ggs-back.duckdns.org/privkey.pem;

    location / {
        # Docker 내부 DNS (컨테이너명으로 라우팅)
        resolver           127.0.0.11 valid=10s;
        set $upstream      "blue";
        proxy_pass         http://$upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
